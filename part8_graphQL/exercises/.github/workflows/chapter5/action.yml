name: 'Test Chapter 5'
description: 'Runs backend tests for library'

runs:
    using: 'composite'
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version: 24

        - name: Install library-backend dependencies
          shell: bash
          working-directory: part8_graphQL/exercises/library-backend
          run: npm ci

        - name: Install library-frontend dependencies
          shell: bash
          working-directory: part8_graphQL/exercises/library-frontend
          run: npm ci

        - name: Install E2E test dependencies
          shell: bash
          working-directory: part8_graphQL/exercises/tests-chapter5
          run: npm ci

        - name: Install Playwright browsers
          shell: bash
          working-directory: part8_graphQL/exercises/tests-chapter5
          run: npx playwright install chromium --with-deps

        - name: Run E2E tests
          shell: bash
          working-directory: part8_graphQL/exercises/tests-chapter5
          run: npx playwright test

        - name: Upload test report
          shell: bash
          uses: actions/upload-artifact@v4
          if: ${{ !cancelled() }}
          with:
              name: playwright-report
              path: part8_graphQL/exercises/tests-chapter5/playwright-report/
              retention-days: 7
